name: Deploy 3D walkthrough to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload viewer as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the viewer folder (index.html), not the source/build files.
          path: '1 - Your Files (start here)'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
